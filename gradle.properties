# Gradle Specifications
org.gradle.jvmargs=-Xms256M -Xmx2G
org.gradle.daemon=false

# General Specifications
mc_version=1.12.2
mod_version=1.0.0
# DO NOT RAISE THIS. 14.23.5.2847 is the last 1.12.2 Forge build that publishes a
# `-userdev.jar` artifact. Builds 2848+ publish only `-userdev3.jar`, which is the
# ForgeGradle 3 format that the ForgeGradle 2.3 fork used here cannot consume - the
# download 404s and the build fails. This is a toolchain ceiling, not a bug.
# It does not limit what players can run: 1.12.2 Forge is binary-compatible across
# these builds, so a mod compiled against 2847 runs fine on 2860.
forge_version=14.23.5.2847
mod_group=com.exiledradio
# Changing this breaks every existing world. It is the name of the config file, the domain of every
# block and item this mod registers, the key its villager data lives under inside each villager, and
# the network channel - so a rename orphans every workstation already placed and loses every
# villager's job, level, gossip and bed.
#
# It was renamed once, from villagertrading, deliberately and before the mod had ever shipped. That
# was the only free moment it will ever have. The display name above can change whenever it likes;
# this cannot change again.
mod_id=villagerbackport
mod_name=1.14 Villager Backport
mod_archives_name=VillagerBackport
mod_author=ExiledRadio
mod_description=Brings 1.14's villages to 1.12.2. Villagers take jobs from workstations, restock twice a day, price their trades by supply and demand, and remember who you are - trade with them and they charge less, cure one of zombiehood and it never forgets. They claim beds, sleep at night, breed when a bed is free rather than when doors are, and call an iron golem when frightened. Ported from the 1.14.4 sources rather than from memory.
mod_credits=By ExiledRadio. Not affiliated with Mojang.
mod_url=https://github.com/ExiledRadio/VillagerBackport

# Dev-only: set `deployDir` in ~/.gradle/gradle.properties to auto-copy the
# built jar into a test instance's mods folder. Deliberately not set here so
# the build stays machine-independent.
