buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "github"
            url = "https://github.com/juanmuscaria/maven/raw/master"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle2:[2.3-1.0.0-SNAPSHOT,)'
    }
}

repositories {
	// Backport Core's dev jar, put here by its copyToDependents task. Not committed.
	flatDir {
		dirs 'deps'
	}
	// CurseMaven serves CurseForge files by project and file id, so the version is pinned exactly.
	maven { url 'https://cursemaven.com' }
}

apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group
archivesBaseName = mod_archives_name

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
	// Single-sourced from gradle.properties — see the ceiling note on forge_version there.
	version = "${mc_version}-${forge_version}"
    mappings = "stable_39"
	runDir = "eclipse"

	replace '@VERSION@', project.version
	replaceIn 'VillagerBackport.java'
}

// The Mouse Tweaks opt-out annotation is compiled against, never shipped.
//
// Mouse Tweaks looks it up by name on the trade screen's class and stands down if it is there, and
// its documented way to use it without a dependency is to declare the annotation yourself. Shipping
// our copy would put a second class with their fully-qualified name into the game, and which one
// wins is then up to the classloader - the sort of thing that works until it silently does not.
//
// Compiling against it and leaving it out of the jar gets the best of both. With Mouse Tweaks
// installed its own class supplies the type and the annotation resolves; without it, the annotation
// simply never resolves, and an annotation whose class is missing is one the JVM never looks at.
// The same goes for the handful of JEI interfaces under mezz/, which the plugin that hides
// duplicated workstations is compiled against. JEI is the only thing that loads that plugin, so
// when the types are needed JEI's real ones are there.
jar {
    exclude 'yalter/**'
    exclude 'mezz/**'
}

processResources {

	// Gradle does not treat `expand` values as task inputs, so without declaring them
	// here the task stays UP-TO-DATE across a version bump and the jar ships an
	// mcmod.info still claiming the previous version. Declaring them makes a changed
	// property invalidate the task the way a changed file would.
	inputs.property 'version', project.version
	inputs.property 'mod_id', mod_id
	inputs.property 'mod_name', mod_name
	inputs.property 'mod_author', mod_author
	inputs.property 'mod_description', mod_description
	inputs.property 'mod_credits', mod_credits
	inputs.property 'mod_url', mod_url
	inputs.property 'mc_version', mc_version
	inputs.property 'mod_version', mod_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version,
		'mod_id': mod_id,
		'mod_name': mod_name,
		'mod_author': mod_author,
		'mod_description': mod_description,
		'mod_credits': mod_credits,
		'mod_url': mod_url,
		'mc_version': mc_version,
		'mod_version': mod_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

dependencies {
	// Backport Core, required. Its copyToDependents task puts the MCP-named dev jar into deps/:
	// `gradlew build copyToDependents` in E:/MincraftModding/Workspaces/BackportCore. Plain compile,
	// not deobfCompile: flatDir matches by file name, so deobfCompile would hand ForgeGradle the
	// SRG-named jar and compile against that. The dev jar is also what puts Core on the
	// runClient/runServer classpath, where FML finds it as a mod.
	compile name: "BackportCore-${core_version}-dev"
	// Fluidlogged API 3.3.3 (CurseForge 485654, file 8445863), which Backport Core 1.1.0 requires.
	// Core's dev jar does not carry it. deobfCompile maps it to dev names, and FG2's GradleStart
	// finds its coremod on the classpath. Never shade it.
	deobfCompile 'curse.maven:fluidlogged-api-485654:8445863'
}

// Headless self-tests live in src/selftest/java and are compiled in only for a test run:
//
//     ./gradlew runServer -Pselftest=all       (the server checks)
//     ./gradlew runClient -Pselftest=client    (the title-screen checks, read from the log)
//
// Without the property the directory is not a source directory at all, and the jars exclude the
// package in case a test build's classes are still in build/classes. A test run needs them IN the
// jar, because FG2's runServer runs from the jar - one more reason a release is built last, with
// --rerun-tasks.
def selftest = project.findProperty('selftest')
if (selftest) {
	sourceSets.main.java.srcDir 'src/selftest/java'
} else {
	jar {
		exclude 'com/exiledradio/villagerbackport/selftest/**'
	}
}
[runServer, runClient].each { task ->
	task.outputs.upToDateWhen { false }
	if (selftest) {
		task.systemProperty 'villagerbackport.selftest', selftest
	}
}

// No other third-party dependencies, and deliberately no coremod or Mixin. This mod
// changes villager *behaviour*, which is normally the kind of thing that wants an
// ASM patch - but every other mod in a large pack that touches villagers reaches
// them through VillagerRegistry and MerchantRecipe, not through the restock path.
// Ticking the entity from an event and editing the recipe list it already owns
// gets the same result with none of the patch-collision surface. See
// docs/COMPATIBILITY.md for the survey this conclusion came from.

task devJar(type: Jar) {
	classifier = 'dev'
	from sourceSets.main.output
	// A dev environment with JEI in it must get JEI's interfaces, not the stand-ins.
	exclude 'mezz/**'
	exclude 'com/exiledradio/villagerbackport/selftest/**'
}

task sourcesJar(type: Jar) {
	classifier = 'sources'
	from sourceSets.main.allSource
	exclude 'com/exiledradio/villagerbackport/selftest/**'
}

artifacts {
	archives devJar
	archives sourcesJar
}

// Dev convenience: copies the built jar straight into a local test instance so
// testing changes doesn't require a manual copy step. Opt-in and machine-local
// — set `vbpDeployDir` in your user gradle.properties (~/.gradle/gradle.properties),
// not here, so the build still works for anyone else who clones the repo.
// Its own name, not the shared `deployDir`: that one belongs to another mod's build and points at a
// played modpack, which then received a 2.5.0 build without the Backport Core it needs.
def deployDir = project.findProperty('vbpDeployDir')

task deployToInstance(type: Copy) {
	onlyIf { deployDir && file(deployDir).isDirectory() }

	// Clear out builds of *this* mod from previous versions first. The jar name carries the
	// version, so a version bump would otherwise leave the old jar sitting beside the new one,
	// and FML hard-crashes on two mods declaring the same modid.
	//
	// Both the current archive name and the ones this mod has been called before, because a rename
	// is exactly when this matters most: the new jar lands under a new name, the old one is left
	// untouched beside it, and the game refuses to start with no obvious reason why. Scoped to names
	// this project has actually used, so it can only ever match our own artifacts.
	doFirst {
		if (deployDir && file(deployDir).isDirectory()) {
			def names = [archivesBaseName, 'RLCraftVillagerTrading']
			file(deployDir).listFiles()?.each { f ->
				if (names.any { n -> f.name ==~ /^${n}-.*\.jar$/ }) {
					logger.lifecycle("Removing previous build: ${f.name}")
					f.delete()
				}
			}
		}
	}

	from jar.archivePath
	into deployDir ?: "$buildDir/deploy"
	rename { "${archivesBaseName}-${project.version}.jar" }
}

deployToInstance.dependsOn reobfJar

// reobfJar rewrites the jar in place, which Gradle cannot see, so it can decide there is nothing to
// do and leave a jar with development names in it. That jar works in runClient and crashes a real
// instance with NoSuchMethodError on the first Minecraft method it calls. Always run it.
reobfJar.outputs.upToDateWhen { false }
build.finalizedBy deployToInstance
